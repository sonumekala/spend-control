apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-service
  namespace: vendor-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management
  template:
    metadata:
      labels:
        app: management
    spec:
      containers:
        - name: management
          image: <ecr-url>/management:latest
          ports:
            - containerPort: 8080
          env:
            - name: HOST
              value: "definition-service:6565"
            - name: PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: management-service
  namespace: vendor-app
spec:
  selector:
    app: management
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
